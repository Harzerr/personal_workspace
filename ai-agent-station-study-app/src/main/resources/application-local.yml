server:
  port: ${WORKSPACE_SERVER_PORT:8099}
  address: ${WORKSPACE_SERVER_ADDRESS:127.0.0.1}

thread:
  pool:
    executor:
      config:
        core-pool-size: 2
        max-pool-size: 4
        keep-alive-time: 5000
        block-queue-size: 200
        policy: CallerRunsPolicy

spring:
  datasource:
    postgresql:
      username: ${WORKSPACE_POSTGRES_USERNAME}
      password: ${WORKSPACE_POSTGRES_PASSWORD}
      url: ${WORKSPACE_POSTGRES_URL}
      driver-class-name: org.postgresql.Driver
      type: com.zaxxer.hikari.HikariDataSource
      hikari:
        pool-name: WorkspacePostgreSQL
        minimum-idle: 1
        maximum-pool-size: 4
        idle-timeout: 60000
        max-lifetime: 1800000
        connection-timeout: 10000
  data:
    redis:
      host: ${WORKSPACE_REDIS_HOST:127.0.0.1}
      port: ${WORKSPACE_REDIS_PORT:6379}
      timeout: 3s
  ai:
    openai:
      base-url: ${WORKSPACE_OPENAI_BASE_URL:https://api.openai.com}
      api-key: ${WORKSPACE_OPENAI_API_KEY}
      chat:
        options:
          model: ${WORKSPACE_OPENAI_CHAT_MODEL:gpt-4o-mini}
    agent:
      auto-config:
        enabled: true

workspace:
  workflow:
    ops-agent-id: ${WORKSPACE_OPS_AGENT_ID:71908740}
  knowledge:
    embedding:
      base-url: ${WORKSPACE_EMBEDDING_BASE_URL:${WORKSPACE_OPENAI_BASE_URL:https://api.openai.com}}
      api-key: ${WORKSPACE_EMBEDDING_API_KEY:${WORKSPACE_OPENAI_API_KEY}}
      model: ${WORKSPACE_EMBEDDING_MODEL:text-embedding-3-small}
      dimensions: ${WORKSPACE_EMBEDDING_DIMENSIONS:1536}
  blog:
    storage-dir: ${WORKSPACE_BLOG_STORAGE_DIR:./data/blog}
    csdn:
      credentials-file: ${WORKSPACE_CSDN_CREDENTIALS_FILE:}
      api-url: ${WORKSPACE_CSDN_API_URL:https://bizapi.csdn.net/blog-console-api/v3/mdeditor/saveArticle}
  task:
    job:
      enabled: true
      pool-size: 2
      thread-name-prefix: workspace-task-
      wait-for-tasks-to-complete-on-shutdown: true
      await-termination-seconds: 20
      refresh-interval: 30000
      clean-invalid-tasks-cron: "0 0/5 * * * ?"

logging:
  level:
    root: info
  config: classpath:logback-spring.xml
