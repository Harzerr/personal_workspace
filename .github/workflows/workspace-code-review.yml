name: Personal AI Workspace review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: workspace-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      WORKSPACE_REVIEW_SECRET: ${{ secrets.WORKSPACE_REVIEW_SECRET }}
      WORKSPACE_REVIEW_URL: ${{ vars.WORKSPACE_REVIEW_URL || 'http://101.43.51.64/ai-agent-study/api/v1/workspace/default/integrations/github/code-review' }}
    steps:
      - name: Check integration configuration
        id: config
        shell: bash
        run: |
          if [[ -z "$WORKSPACE_REVIEW_SECRET" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Workspace review is skipped because WORKSPACE_REVIEW_SECRET is unavailable."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run configured Workspace agents
        if: steps.config.outputs.enabled == 'true'
        id: review
        shell: bash
        env:
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          body=$(jq -cn \
            --arg repositoryUrl "$REPOSITORY_URL" \
            --arg baseSha "$BASE_SHA" \
            --arg headSha "$HEAD_SHA" \
            --arg repository "$REPOSITORY" \
            --arg title "$PR_TITLE" \
            --argjson pullRequestNumber "$PR_NUMBER" \
            '{repositoryUrl:$repositoryUrl,baseSha:$baseSha,headSha:$headSha,repository:$repository,title:$title,pullRequestNumber:$pullRequestNumber}')
          timestamp=$(date +%s)
          delivery="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          signature=$(BODY="$body" TIMESTAMP="$timestamp" python3 - <<'PY'
          import hashlib
          import hmac
          import os
          message = (os.environ["TIMESTAMP"] + "." + os.environ["BODY"]).encode()
          print("sha256=" + hmac.new(os.environ["WORKSPACE_REVIEW_SECRET"].encode(), message, hashlib.sha256).hexdigest())
          PY
          )

          response_file="$RUNNER_TEMP/workspace-review.json"
          http_code=$(curl --silent --show-error \
            --connect-timeout 15 --max-time 720 \
            --output "$response_file" --write-out '%{http_code}' \
            -X POST "$WORKSPACE_REVIEW_URL" \
            -H 'Content-Type: application/json' \
            -H "X-Workspace-Timestamp: $timestamp" \
            -H "X-Workspace-Delivery: $delivery" \
            -H "X-Workspace-Signature-256: $signature" \
            --data-binary "$body")

          if [[ "$http_code" -lt 200 || "$http_code" -ge 300 ]]; then
            echo "Workspace returned HTTP $http_code"
            jq -r '.message // .error // "No error details returned"' "$response_file" || true
            exit 1
          fi
          jq -e '.data.runId and .data.status' "$response_file" >/dev/null
          echo "response_file=$response_file" >> "$GITHUB_OUTPUT"

      - name: Update pull request report
        if: steps.config.outputs.enabled == 'true' && steps.review.outcome == 'success'
        shell: bash
        env:
          RESPONSE_FILE: ${{ steps.review.outputs.response_file }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          marker='<!-- personal-ai-workspace-review -->'
          status=$(jq -r '.data.status' "$RESPONSE_FILE")
          run_id=$(jq -r '.data.runId' "$RESPONSE_FILE")
          report=$(jq -r '.data.report // .data.error // "Workspace did not return a report."' "$RESPONSE_FILE")
          comment=$(printf '%s\n## Personal AI Workspace review\n\n**Status:** `%s`  \n**Run:** `%s`\n\n%s\n' \
            "$marker" "$status" "$run_id" "$report")
          comment_id=$(gh api "repos/$REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq ".[] | select(.body | contains(\"$marker\")) | .id" | head -n 1)
          if [[ -n "$comment_id" ]]; then
            jq -n --arg body "$comment" '{body:$body}' | \
              gh api --method PATCH "repos/$REPOSITORY/issues/comments/$comment_id" --input - >/dev/null
          else
            jq -n --arg body "$comment" '{body:$body}' | \
              gh api --method POST "repos/$REPOSITORY/issues/$PR_NUMBER/comments" --input - >/dev/null
          fi
          if [[ "$status" != "COMPLETED" ]]; then
            echo "Workspace review finished with status $status"
            exit 1
          fi
